services:
  postgres:
    image: postgres:16-alpine
    container_name: alertup-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alertup
    ports:
      - "5432:5432"
    volumes:
      - alertup_pgdata:/var/lib/postgresql/data

volumes:
  alertup_pgdata:
